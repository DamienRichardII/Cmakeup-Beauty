<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMAKEUP BEAUTY — Définir un mot de passe</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF; --off:#F4F4F2; --line:#D6D1C5;
    --ink:#1A1A1A; --ink-soft:#75736D; --gray:#B8B6A9; --danger:#B33A3A; --ok:#5B7A5B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--off); color:var(--ink); font-family:'TT Interphase','Jost', sans-serif; font-weight:300;}
  h1,h2{font-family:'The Silver Editorial','Cormorant Garamond', serif; font-weight:400;}
  .login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{background:var(--white); border:1px solid var(--line); padding:48px 40px; width:100%; max-width:400px;}
  .logo{font-family:'The Silver Editorial','Cormorant Garamond', serif; font-size:22px; letter-spacing:0.14em; text-align:center;}
  .logo span{display:block; font-family:'TT Interphase','Jost',sans-serif; font-size:9px; letter-spacing:0.28em; color:var(--gray); margin-top:4px;}
  .sub{text-align:center; font-size:12px; color:var(--ink-soft); letter-spacing:0.06em; margin:24px 0 32px; line-height:1.6;}
  .field{display:flex; flex-direction:column; gap:8px; margin-bottom:20px;}
  .field label{font-size:11px; letter-spacing:0.06em; color:var(--ink-soft); text-transform:uppercase;}
  .field input{border:none; border-bottom:1px solid var(--line); padding:12px 4px; font-family:inherit; font-size:15px; background:transparent; width:100%;}
  .field input:focus{outline:none; border-bottom-color:var(--ink);}
  .btn{border:1px solid var(--ink); padding:13px 26px; font-size:12px; letter-spacing:0.08em; background:var(--ink); color:var(--white); width:100%; cursor:pointer; margin-top:8px;}
  .btn:hover{background:var(--white); color:var(--ink);}
  .btn:disabled{opacity:0.5;}
  .msg{font-size:13px; min-height:18px; margin-top:16px; text-align:center;}
</style>
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="logo">CMAKEUP<br>BEAUTY<span>ESPACE ADMIN</span></div>
    <p class="sub" id="introText">Choisis ton mot de passe pour activer ton accès admin.</p>
    <form id="pwForm">
      <div class="field">
        <label for="pw1">Nouveau mot de passe</label>
        <input type="password" id="pw1" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="pw2">Confirme le mot de passe</label>
        <input type="password" id="pw2" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn" id="pwBtn">Valider</button>
      <p class="msg" id="pwMsg"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  var _sb = window.supabase.createClient('https://haymfuvlbogtiempezto.supabase.co','sb_publishable_koY3vqHccqd5gugGwZJm6g__9Jahr1K');
  var msg = document.getElementById('pwMsg');

  _sb.auth.getSession().then(function(res){
    if(!res.data || !res.data.session){
      msg.style.color = 'var(--danger)';
      msg.textContent = "Ce lien n'est plus valide. Redemande un email depuis la page de connexion.";
      document.getElementById('pwBtn').disabled = true;
    }
  });

  document.getElementById('pwForm').addEventListener('submit', function(e){
    e.preventDefault();
    var pw1 = document.getElementById('pw1').value;
    var pw2 = document.getElementById('pw2').value;
    if(pw1 !== pw2){
      msg.style.color = 'var(--danger)';
      msg.textContent = 'Les deux mots de passe ne correspondent pas.';
      return;
    }
    var btn = document.getElementById('pwBtn');
    btn.disabled = true; btn.textContent = 'Validation...';
    _sb.auth.updateUser({ password: pw1 }).then(function(res){
      if(res.error){
        btn.disabled = false; btn.textContent = 'Valider';
        msg.style.color = 'var(--danger)';
        msg.textContent = "Erreur : " + res.error.message;
        return;
      }
      _sb.auth.signOut().then(function(){
        window.location.href = 'admin-login.html?reset=1';
      });
    });
  });
})();
</script>
</body>
</html>
