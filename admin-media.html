<style>
  :root{
    --white:#FFFFFF; --off:#F4F4F2; --paper:#D6D1C5; --line:#D6D1C5;
    --ink:#1A1A1A; --ink-soft:#75736D; --gray:#B8B6A9; --ok:#5B7A5B; --warn:#B8863B; --danger:#B33A3A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--off); color:var(--ink); font-family:'TT Interphase','Jost', sans-serif; font-weight:300;}
  h1,h2,h3{font-family:'The Silver Editorial','Cormorant Garamond', serif; font-weight:400;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1200px; margin:0 auto; padding:0 40px;}

  header.admin-head{display:flex; align-items:center; justify-content:space-between; padding:22px 40px; border-bottom:1px solid var(--line); background:var(--white);}
  .logo{font-family:'The Silver Editorial','Cormorant Garamond', serif; font-size:20px; letter-spacing:0.14em;}
  .logo span{display:block; font-family:'TT Interphase','Jost',sans-serif; font-size:9px; letter-spacing:0.28em; color:var(--gray); margin-top:2px;}
  .head-right{display:flex; align-items:center; gap:20px; font-size:13px; color:var(--ink-soft);}
  .btn{border:1px solid var(--ink); border-radius:2px; padding:12px 26px; font-size:12px; letter-spacing:0.1em; background:var(--ink); color:var(--white); display:inline-block; cursor:pointer; transition:background .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease; box-shadow:0 1px 2px rgba(26,26,26,0.06);}
  .btn:hover{background:var(--white); color:var(--ink); box-shadow:0 6px 18px rgba(26,26,26,0.14); transform:translateY(-1px);}
  .btn:active{transform:translateY(0); box-shadow:0 1px 3px rgba(26,26,26,0.1);}
  .btn-outline{border:1px solid var(--line); background:transparent; color:var(--ink); box-shadow:none;}
  .btn-outline:hover{border-color:var(--ink); box-shadow:0 6px 18px rgba(26,26,26,0.08);}
  .btn-small{padding:9px 18px; font-size:11px;}
  .btn:disabled{opacity:0.5; cursor:default; transform:none; box-shadow:none;}

  nav.admin-tabs{display:flex; gap:0; background:var(--white); border-bottom:1px solid var(--line); overflow-x:auto;}
  nav.admin-tabs a{padding:16px 24px; font-size:13px; letter-spacing:0.04em; color:var(--ink-soft); border-bottom:2px solid transparent; white-space:nowrap;}
  nav.admin-tabs a.current{color:var(--ink); border-bottom-color:var(--ink);}
  nav.admin-tabs a:hover{color:var(--ink);}

  main{padding:48px 0 80px;}
  .section-title{font-size:13px; letter-spacing:0.16em; color:var(--gray); text-transform:uppercase; margin-bottom:18px;}
  .info-card{background:var(--white); border:1px solid var(--line); border-left:3px solid var(--ink); padding:18px 22px; font-size:13px; color:var(--ink-soft); line-height:1.7; margin-bottom:32px;}
  .info-card strong{color:var(--ink);}

  .filters{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .filters select, .filters button{border:1px solid var(--line); border-radius:2px; background:var(--white); padding:8px 14px; font-size:12px; cursor:pointer; color:var(--ink-soft); font-family:inherit; transition:border-color .2s ease, box-shadow .2s ease;}
  .filters select:hover, .filters button:hover{border-color:var(--ink); color:var(--ink);}
  .filters select:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(26,26,26,0.08);}
  .filters select#pageSelect{font-size:13px; padding:10px 16px; min-width:280px; color:var(--ink);}
  .filters a.view-live{font-size:12px; text-decoration:underline; color:var(--ink-soft); margin-left:auto;}
  .filters a.view-live:hover{color:var(--ink);}

  .empty-row{color:var(--ink-soft); font-style:italic; padding:20px 0;}

  .block-card{background:var(--white); border:1px solid var(--line); padding:20px 22px; margin-bottom:14px;}
  .block-card .block-label{font-size:12px; letter-spacing:0.04em; color:var(--ink); font-weight:400; display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .block-card .block-type-tag{font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--white); background:var(--gray); padding:2px 8px; border-radius:2px;}
  .block-card .block-type-tag.type-title{background:var(--ink);}
  .block-card .block-type-tag.type-image{background:var(--warn);}
  .block-card .block-type-tag.type-video{background:#6B7FA3;}
  .block-card input[type="text"], .block-card textarea{width:100%; border:1px solid var(--line); padding:10px 12px; font-family:inherit; font-size:13px; background:var(--off);}
  .block-card textarea{min-height:80px; resize:vertical;}
  .block-card input[type="text"]:focus, .block-card textarea:focus{outline:none; border-color:var(--ink); background:var(--white);}
  .block-card .row{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;}
  .block-card .img-preview-wrap{flex-shrink:0;}
  .block-card .img-preview{width:220px; max-width:100%; height:165px; object-fit:contain; border:1px solid var(--line); border-radius:2px; background:var(--off); padding:6px; display:block; box-shadow:0 1px 3px rgba(26,26,26,0.05);}
  .block-card .img-fields{flex:1; min-width:220px; display:flex; flex-direction:column; gap:8px;}
  .block-card .file-picker{position:relative; display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:2px;}
  .block-card .file-picker-btn{margin:0;}
  .block-card .file-picker-name{font-size:12px; color:var(--ink-soft); font-style:italic;}
  .file-input-hidden{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  .block-card .field-note{font-size:11px; color:var(--ink-soft); margin-top:6px;}
  .save-bar{position:sticky; bottom:0; background:var(--white); border-top:1px solid var(--line); padding:16px 0; margin-top:24px; display:flex; align-items:center; gap:16px;}
  .save-bar .save-msg{font-size:12px; color:var(--ok);}
  .save-bar .save-msg.err{color:var(--danger);}
  .reset-page-btn{margin-left:auto; font-size:11px; color:var(--danger); text-decoration:underline; cursor:pointer; background:none; border:none; font-family:inherit;}

  @media(max-width:760px){
    .wrap{padding:0 20px;}
    header.admin-head{padding:18px 20px;}
    nav.admin-tabs a{padding:14px 16px;}
    .filters a.view-live{margin-left:0;}
    .block-card .row{flex-direction:column;}
  }
</style>
</head>

;

  var currentSlug = null;
  var currentOverrides = {}; // block_key -> row {content, block_type}
  var pendingImageUploads = {}; // block_key -> File

  function esc(s){ return (s||'').toString().replace(/</g,'&lt;'); }

  function populatePageSelect(){
    var sel = document.getElementById('pageSelect');
    var slugs = Object.keys(MANIFEST);
    sel.innerHTML = slugs.map(function(slug){
      var label = PAGE_LABELS[slug] || MANIFEST[slug].file;
      return '<option value="'+slug+'">'+esc(label)+'</option>';
    }).join('');
  }

  function isLongText(key, type){
    if(type === 'title') return false;
    return /text|lede|tagline/.test(key) && key.indexOf('eyebrow') === -1;
  }

  function typeTagLabel(type){
    return {title:'Titre', text:'Texte', image:'Photo', video:'Vidéo'}[type] || type;
  }

  function renderBlocks(){
    var data = MANIFEST[currentSlug];
    var container = document.getElementById('blocksContainer');
    if(!data || !data.blocks.length){
      container.innerHTML = '<p class="empty-row">Aucun bloc éditable détecté sur cette page.</p>';
      return;
    }
    container.innerHTML = data.blocks.map(function(b){
      var override = currentOverrides[b.key];
      var currentValue = override && override.content != null ? override.content : '';
      if(b.type === 'image'){
        var previewSrc = currentValue || b.default || '';
        return '<div class="block-card" data-key="'+b.key+'" data-type="image">'
          + '<div class="block-label"><span class="block-type-tag type-image">'+typeTagLabel(b.type)+'</span> '+esc(b.label)+'</div>'
          + '<div class="row">'
            + '<div class="img-preview-wrap"><img class="img-preview" src="'+esc(previewSrc)+'" alt="" onerror="this.style.opacity=0.3;"></div>'
            + '<div class="img-fields">'
              + '<input type="text" class="img-url-input" placeholder="URL de l\'image (ou choisis un fichier ci-dessous)" value="'+esc(currentValue)+'">'
              + '<div class="file-picker">'
                + '<label class="btn btn-outline btn-small file-picker-btn" for="file-'+b.key+'">Choisir une photo</label>'
                + '<input type="file" id="file-'+b.key+'" class="img-file-input file-input-hidden" accept="image/*">'
                + '<span class="file-picker-name">Aucun fichier choisi</span>'
              + '</div>'
              + '<div class="field-note">Par défaut : '+esc(b.default)+'</div>'
            + '</div>'
          + '</div>'
        + '</div>';
      }
      if(b.type === 'video'){
        return '<div class="block-card" data-key="'+b.key+'" data-type="video">'
          + '<div class="block-label"><span class="block-type-tag type-video">'+typeTagLabel(b.type)+'</span> '+esc(b.label)+'</div>'
          + '<input type="text" class="field-input" placeholder="https://www.youtube.com/watch?v=... ou .mp4" value="'+esc(currentValue)+'">'
          + '<div class="field-note">Accepte un lien YouTube, Vimeo, ou un fichier vidéo direct (.mp4). Laisse vide pour ne rien afficher.</div>'
        + '</div>';
      }
      var tagClass = b.type === 'title' ? ' type-title' : '';
      var inputHtml = isLongText(b.key, b.type)
        ? '<textarea class="field-input">'+esc(currentValue)+'</textarea>'
        : '<input type="text" class="field-input" value="'+esc(currentValue)+'">';
      return '<div class="block-card" data-key="'+b.key+'" data-type="'+b.type+'">'
        + '<div class="block-label"><span class="block-type-tag'+tagClass+'">'+typeTagLabel(b.type)+'</span> '+esc(b.label)+'</div>'
        + inputHtml
        + '<div class="field-note">Par défaut : '+esc(b.default || '—')+'</div>'
      + '</div>';
    }).join('');

    // wire image file inputs -> live preview on selection
    Array.prototype.forEach.call(container.querySelectorAll('.block-card[data-type="image"]'), function(card){
      var fileInput = card.querySelector('.img-file-input');
      var urlInput = card.querySelector('.img-url-input');
      var preview = card.querySelector('.img-preview');
      var fileName = card.querySelector('.file-picker-name');
      var key = card.getAttribute('data-key');
      fileInput.addEventListener('change', function(){
        var file = fileInput.files[0];
        if(!file) return;
        pendingImageUploads[key] = file;
        fileName.textContent = file.name;
        var reader = new FileReader();
        reader.onload = function(e){ preview.src = e.target.result; };
        reader.readAsDataURL(file);
      });
      urlInput.addEventListener('input', function(){
        delete pendingImageUploads[key];
        fileInput.value = '';
        fileName.textContent = 'Aucun fichier choisi';
        preview.src = urlInput.value;
      });
    });

    document.getElementById('viewLiveLink').href = data.file;
  }

  function loadPage(slug, preserveMsg){
    currentSlug = slug;
    currentOverrides = {};
    pendingImageUploads = {};
    document.getElementById('blocksContainer').innerHTML = '<p class="empty-row">Chargement…</p>';
    if(!preserveMsg){ document.getElementById('saveMsg').textContent = ''; }
    _sb.from('page_content').select('block_key,block_type,content').eq('page_slug', slug).then(function(res){
      if(!res.error && res.data){
        res.data.forEach(function(row){ currentOverrides[row.block_key] = row; });
      }
      renderBlocks();
    });
  }

  function slugify(filename){
    return filename.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function uploadImage(slug, key, file){
    var path = slug + '/' + key + '-' + Date.now() + '-' + slugify(file.name);
    return _sb.storage.from('page-media').upload(path, file, { upsert: true, contentType: file.type }).then(function(res){
      if(res.error) throw res.error;
      var pub = _sb.storage.from('page-media').getPublicUrl(path);
      return pub.data.publicUrl;
    });
  }

  function saveAll(){
    var saveBtn = document.getElementById('saveBtn');
    var msg = document.getElementById('saveMsg');
    saveBtn.disabled = true;
    msg.className = 'save-msg';
    msg.textContent = 'Enregistrement…';

    _sb.auth.getSession().then(function(sres){
      var userId = sres.data && sres.data.session ? sres.data.session.user.id : null;
      var container = document.getElementById('blocksContainer');
      var cards = Array.prototype.slice.call(container.querySelectorAll('.block-card'));

      var uploadPromises = cards.map(function(card){
        var key = card.getAttribute('data-key');
        if(card.getAttribute('data-type') === 'image' && pendingImageUploads[key]){
          return uploadImage(currentSlug, key, pendingImageUploads[key]).then(function(url){
            card.querySelector('.img-url-input').value = url;
            return null;
          });
        }
        return Promise.resolve(null);
      });

      Promise.all(uploadPromises).then(function(){
        var rows = cards.map(function(card){
          var key = card.getAttribute('data-key');
          var type = card.getAttribute('data-type');
          var value;
          if(type === 'image'){
            value = card.querySelector('.img-url-input').value.trim();
          } else {
            value = card.querySelector('.field-input').value.trim();
          }
          return {
            page_slug: currentSlug,
            block_key: key,
            block_type: type,
            content: value,
            updated_at: new Date().toISOString(),
            updated_by: userId
          };
        }).filter(function(r){ return r.content !== ''; });

        var deleteKeys = cards.map(function(card){ return card.getAttribute('data-key'); })
          .filter(function(key){
            var card = container.querySelector('.block-card[data-key="'+key+'"]');
            var type = card.getAttribute('data-type');
            var value = type === 'image' ? card.querySelector('.img-url-input').value.trim() : card.querySelector('.field-input').value.trim();
            return value === '';
          });

        var ops = [];
        if(rows.length){
          ops.push(_sb.from('page_content').upsert(rows, { onConflict: 'page_slug,block_key' }));
        }
        if(deleteKeys.length){
          ops.push(_sb.from('page_content').delete().eq('page_slug', currentSlug).in('block_key', deleteKeys));
        }

        Promise.all(ops).then(function(results){
          var hasError = results.some(function(r){ return r && r.error; });
          saveBtn.disabled = false;
          pendingImageUploads = {};
          if(hasError){
            msg.className = 'save-msg err';
            msg.textContent = "Une erreur est survenue lors de l'enregistrement.";
          } else {
            msg.className = 'save-msg';
            msg.textContent = 'Modifications enregistrées ✓';
            loadPage(currentSlug, true);
          }
        });
      }).catch(function(){
        saveBtn.disabled = false;
        msg.className = 'save-msg err';
        msg.textContent = "Erreur lors de l'envoi d'une image.";
      });
    });
  }

  function resetPage(){
    if(!confirm('Supprimer toutes les modifications enregistrées pour cette page et revenir au contenu d\'origine ?')) return;
    _sb.from('page_content').delete().eq('page_slug', currentSlug).then(function(res){
      if(!res.error){
        loadPage(currentSlug);
      }
    });
  }

  populatePageSelect();
  document.getElementById('pageSelect').addEventListener('change', function(){
    loadPage(this.value);
  });
  document.getElementById('saveBtn').addEventListener('click', saveAll);
  document.getElementById('resetPageBtn').addEventListener('click', resetPage);

  if(TEMP_DISABLE_LOGIN){
    document.querySelectorAll('.admin-name').forEach(function(el){ el.textContent = 'Mode test (login désactivé)'; });
    loadPage(Object.keys(MANIFEST)[0]);
  } else {
    _sb.auth.getSession().then(function(res){
      var session = res.data && res.data.session;
      if(!session){ window.location.href = 'admin-login.html'; return; }
      _sb.from('admins').select('prenom').eq('id', session.user.id).maybeSingle().then(function(r){
        if(r.error || !r.data){
          _sb.auth.signOut().then(function(){ window.location.href = 'admin-login.html?denied=1'; });
          return;
        }
        document.querySelectorAll('.admin-name').forEach(function(el){ el.textContent = r.data.prenom; });
        loadPage(Object.keys(MANIFEST)[0]);
      });
    });
  }

  document.getElementById('logoutBtn').addEventListener('click', function(){
    _sb.auth.signOut().then(function(){ window.location.href = 'admin-login.html'; });
  });
})();
</script>
